<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday, Prajjuu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,400&family=Pinyon+Script&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--ivory:#fbf6f0;--blush:#efd2d6;--rose:#c58290;--ink:#4a3540;--soft:#8f7680;--gold:#c4a26a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#fdf8f3,#f8ece9 45%,#f3eef4 75%,#fdf8f3);color:var(--ink);font-family:'Jost',sans-serif;font-weight:300;overflow-x:hidden}
canvas#bg,canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
canvas#bg{z-index:0}canvas#fx{z-index:60}
section{position:relative;z-index:1;padding:110px 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cap{letter-spacing:.38em;text-transform:uppercase;font-size:.68rem;color:var(--soft)}
h2{font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;font-size:clamp(2.1rem,8vw,3.2rem);margin:14px 0 6px}
.line{width:1px;height:50px;background:linear-gradient(var(--gold),transparent);margin-top:18px}
.rule{width:70px;height:1px;background:var(--gold);margin:16px auto}

/* HERO */
.hero{min-height:100vh;justify-content:center}
.hb{font-family:'Cormorant Garamond',serif;font-weight:300;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(1rem,4.6vw,1.5rem);margin:26px 0 0}
.nm{font-family:'Pinyon Script',cursive;font-size:clamp(5.2rem,26vw,11rem);line-height:1.05;color:var(--rose);text-shadow:0 14px 40px rgba(197,130,144,.35);transition:transform .15s}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.25rem;color:var(--soft);margin-top:10px;max-width:300px}
.hero .line{position:absolute;bottom:26px;animation:dr 2.4s ease-in-out infinite}
@keyframes dr{50%{transform:translateY(10px);opacity:.4}}

/* LETTER */
.paper{position:relative;max-width:560px;width:100%;margin-top:40px;padding:60px 36px 46px;text-align:left;background:#fffdf9;border-radius:3px;
box-shadow:0 40px 70px rgba(120,80,95,.18),0 0 0 1px rgba(196,162,106,.25);transition:transform .2s}
.paper::before{content:"";position:absolute;inset:12px;border:1px solid rgba(196,162,106,.45);pointer-events:none}
.paper p{font-family:'Cormorant Garamond',serif;font-size:1.3rem;line-height:1.75;margin-bottom:18px;opacity:0;transform:translateY(16px);transition:1.1s}
.paper p.in{opacity:1;transform:none}
.paper .to{font-family:'Pinyon Script',cursive;font-size:2.5rem;color:var(--rose);line-height:1.2}
.paper .sg{text-align:right;font-family:'Pinyon Script',cursive;font-size:2.1rem;color:var(--rose);margin:10px 0 0}

/* CAKE */
.cakewrap{width:min(400px,96vw);height:440px;margin-top:16px;cursor:grab;touch-action:pan-y;position:relative}
.cakewrap canvas{width:100%;height:100%;display:block}
.cm{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.35rem;min-height:2em;max-width:320px}
.hint{letter-spacing:.25em;font-size:.65rem;text-transform:uppercase;color:var(--soft);margin-top:10px}

/* PAIR */
.pair{font-family:'Pinyon Script',cursive;font-size:clamp(2.8rem,12vw,4.4rem);color:var(--rose);margin-top:10px;display:flex;align-items:center;gap:16px}
.pair svg{width:26px;height:26px;fill:var(--rose);animation:bt 1.6s infinite}
@keyframes bt{50%{transform:scale(1.25)}}
.arches{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;margin-top:46px}
.arch{width:200px;perspective:800px}
.af{height:270px;border-radius:100px 100px 6px 6px;background:linear-gradient(160deg,#f3d6da,#e3d9ee);background-size:cover;background-position:center;
box-shadow:0 26px 44px rgba(120,80,95,.2),inset 0 0 0 6px #fff;transition:transform .6s cubic-bezier(.2,.8,.2,1);display:flex;align-items:flex-end;justify-content:center;padding-bottom:22px}
.arch:hover .af{transform:rotateY(-10deg) rotateX(4deg) translateY(-8px)}
.af span{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:var(--ink);background:rgba(255,255,255,.75);padding:4px 14px;border-radius:20px}

/* LIST */
.list{max-width:460px;width:100%;margin-top:34px;text-align:left}
.it{display:flex;gap:22px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(196,162,106,.35);font-family:'Cormorant Garamond',serif;font-size:1.35rem}
.it b{font-weight:300;font-style:italic;color:var(--gold);font-size:1rem;letter-spacing:.1em}
.btn{margin-top:46px;padding:15px 40px;border:1px solid var(--rose);border-radius:40px;background:transparent;color:var(--rose);font:inherit;letter-spacing:.3em;font-size:.7rem;text-transform:uppercase;cursor:pointer;transition:.4s}
.btn:hover,.btn:active{background:var(--rose);color:#fff}
.rv{opacity:0;transform:translateY(30px);transition:1.1s}.rv.in{opacity:1;transform:none}
footer{position:relative;z-index:1;text-align:center;padding:20px 20px 70px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;color:var(--soft)}
</style>
</head>
<body>
<canvas id="bg"></canvas><canvas id="fx"></canvas>

<section class="hero">
  <p class="cap rv">a little something for you</p>
  <p class="hb rv">Happy Birthday</p>
  <div class="nm rv" id="nm">Prajjuu</div>
  <p class="sub rv">to a gentle man and a rare soul</p>
  <div class="line"></div>
</section>

<section>
  <p class="cap rv">written for you</p>
  <h2 class="rv">A letter</h2>
  <div class="rule"></div>
  <div class="paper" id="paper"></div>
</section>

<section>
  <p class="cap rv">make a wish</p>
  <h2 class="rv">Your cake</h2>
  <div class="cakewrap" id="cake"></div>
  <p class="cm" id="cm">blow out the candle</p>
  <p class="hint">drag to turn &middot; tap to blow</p>
</section>

<section>
  <p class="cap rv">my favourite pair</p>
  <h2 class="rv">Prajjuu &amp; Minchu</h2>
  <div class="pair rv"><span>Prajjuu</span><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg><span>Minchu</span></div>
  <div class="arches" id="arches"></div>
</section>

<section>
  <p class="cap rv">what makes you, you</p>
  <h2 class="rv">So Prajjuu</h2>
  <div class="list" id="list"></div>
  <button class="btn rv" id="fin">Celebrate</button>
</section>

<footer id="ft"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ======== EDIT THIS PART ======== */
const CONFIG={
  me:"Guna",
  letter:[
    "Dear Prajjuu,",
    "Happy birthday to the gentlest man I know.",
    "Some people are loud about being kind. You just quietly are, in the way you listen, the way you show up, the way you never make anyone feel small. The world feels softer with you in it.",
    "And your taste? Truly the weirdest, most wonderful thing. Nobody else’s choices make sense the way yours somehow do. You are one of the most unique creatures on this planet, and I wouldn’t change a single thing about you.",
    "Watching you and Minchu together is one of my favourite things. You two are so genuinely happy, so soft with each other, that I end up smiling like a happy kid, just admiring from the side. Never lose that.",
    "Thank you for being exactly who you are. I’m so happy for everything you are, and for everything still coming your way.",
    "Stay weird. Stay gentle."
  ],
  /* photos: upload to the repo, then set src:"photo1.jpg" */
  photos:[{src:"",cap:"you two"},{src:"",cap:"pure joy"},{src:"",cap:"always"}],
  list:["Quietly kind","Wonderfully weird taste","Gentle to the core","Happiest with Minchu","Unlike anyone else"]
};
/* ================================ */
const $=s=>document.querySelector(s);
$('#ft').textContent="with love, "+CONFIG.me;

// letter
const paper=$('#paper');
CONFIG.letter.forEach((t,i)=>{const p=document.createElement('p');p.textContent=t;if(!i)p.className='to';paper.appendChild(p)});
const sg=document.createElement('p');sg.className='sg';sg.textContent="always yours, "+CONFIG.me;paper.appendChild(sg);
paper.addEventListener('pointermove',e=>{const r=paper.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;paper.style.transform=`perspective(1000px) rotateY(${x*6}deg) rotateX(${-y*6}deg)`});
paper.addEventListener('pointerleave',()=>paper.style.transform='');
const po=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){[...paper.children].forEach((p,i)=>setTimeout(()=>p.classList.add('in'),i*800));po.disconnect()}}),{threshold:.15});po.observe(paper);

// arches
CONFIG.photos.forEach(p=>{const d=document.createElement('div');d.className='arch rv';
d.innerHTML=`<div class="af" style="${p.src?`background-image:url(${p.src})`:''}"><span>${p.cap}</span></div>`;d.onclick=()=>burst(40);$('#arches').appendChild(d)});
// list
CONFIG.list.forEach((t,i)=>{const d=document.createElement('div');d.className='it rv';d.innerHTML=`<b>0${i+1}</b><span>${t}</span>`;$('#list').appendChild(d)});
$('#fin').onclick=()=>{burst(160);setTimeout(()=>burst(120),500)};

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.15});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
document.querySelectorAll('.hero .rv').forEach((e,i)=>setTimeout(()=>e.classList.add('in'),200+i*350));
// 3D name tilt
addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;$('#nm').style.transform=`perspective(700px) rotateY(${x*14}deg) rotateX(${-y*10}deg)`});

// ---------- BACKGROUND: floating pearls ----------
(function(){
const cv=$('#bg'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(50,1,.1,80);C.position.z=8;
function fit(){R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}fit();addEventListener('resize',fit);
S.add(new THREE.HemisphereLight(0xffffff,0xf0d8de,1.1));const d=new THREE.DirectionalLight(0xffffff,.7);d.position.set(3,5,6);S.add(d);
const cols=[0xffffff,0xf3d4d9,0xe6dcf2,0xf6e6c4,0xdfe8dc],ps=[];
for(let i=0;i<46;i++){
  const r=.12+Math.random()*.5,m=new THREE.Mesh(new THREE.SphereGeometry(r,24,24),new THREE.MeshStandardMaterial({color:cols[i%5],roughness:.18,metalness:.15,transparent:true,opacity:.85}));
  m.position.set((Math.random()-.5)*14,-Math.random()*34+2,-Math.random()*8-1);m.userData={y:m.position.y,p:Math.random()*6,s:.3+Math.random()*.5};S.add(m);ps.push(m)}
for(let i=0;i<6;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(.6+Math.random()*.6,.025,12,60),new THREE.MeshStandardMaterial({color:0xc4a26a,metalness:.8,roughness:.25}));
  t.position.set((Math.random()-.5)*12,-Math.random()*32,-Math.random()*5-1);t.userData={y:t.position.y,p:Math.random()*6,s:.4};t.rotation.x=Math.random()*3;S.add(t);ps.push(t)}
let mx=0,sy=0;addEventListener('pointermove',e=>mx=e.clientX/innerWidth-.5);
(function lp(t){
  const h=Math.max(document.body.scrollHeight-innerHeight,1),target=-(scrollY/h)*31;sy+=(target-sy)*.08;
  C.position.y=sy;C.position.x+=(mx*1.2-C.position.x)*.04;
  ps.forEach(m=>{m.position.y=m.userData.y+Math.sin(t/1400*m.userData.s+m.userData.p)*.35;m.rotation.y+=.003});
  R.render(S,C);requestAnimationFrame(lp)})(0);
})();

// ---------- CAKE: simple & sweet ----------
(function(){
const wrap=$('#cake'),R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));wrap.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(34,1,.1,50);C.position.set(0,3.6,10.5);C.lookAt(0,1.4,0);
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}fit();addEventListener('resize',fit);
S.add(new THREE.HemisphereLight(0xfff6f8,0xe8dcf0,1));const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(4,8,6);S.add(dl);
const fl=new THREE.PointLight(0xffcf8a,1.2,6);fl.position.set(0,3.3,0);S.add(fl);
const G=new THREE.Group();S.add(G);
const M=(c,r=.5,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const add=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);G.add(o);return o};
const white=M(0xffffff,.35),gold=M(0xd9b878,.25,.8),pearl=M(0xfffaf5,.15,.2);
add(new THREE.CylinderGeometry(3,3.15,.16,64),gold,0,.08,0);
add(new THREE.CylinderGeometry(2,2,1.2,64),M(0xf3cfd5),0,.76,0);
let ring=add(new THREE.TorusGeometry(2,.12,16,64),white,0,1.36,0);ring.rotation.x=Math.PI/2;
ring=add(new THREE.TorusGeometry(2.01,.03,8,64),gold,0,.62,0);ring.rotation.x=Math.PI/2;
for(let k=0;k<28;k++){const a=k/28*6.283;add(new THREE.SphereGeometry(.08,14,14),pearl,Math.cos(a)*2.04,.32,Math.sin(a)*2.04)}
add(new THREE.CylinderGeometry(1.3,1.3,1,64),M(0xfff4ec),0,1.86,0);
ring=add(new THREE.TorusGeometry(1.3,.11,16,64),white,0,2.36,0);ring.rotation.x=Math.PI/2;
for(let k=0;k<18;k++){const a=k/18*6.283;add(new THREE.SphereGeometry(.075,14,14),pearl,Math.cos(a)*1.34,1.5,Math.sin(a)*1.34)}
for(let k=0;k<9;k++){const a=k/9*6.283,l=.18+(k%3)*.1,x=Math.cos(a)*1.31,z=Math.sin(a)*1.31;
  add(new THREE.CylinderGeometry(.1,.1,l,12),white,x,2.36-l/2,z);add(new THREE.SphereGeometry(.1,12,12),white,x,2.36-l,z)}
for(let k=0;k<3;k++){const a=k/3*6.283+.5;add(new THREE.SphereGeometry(.15,16,16),M(0xc9364b,.2),Math.cos(a)*.75,2.48,Math.sin(a)*.75)}
add(new THREE.CylinderGeometry(.06,.06,.8,14),M(0xf3cfd5),0,2.76,0);
const fm=add(new THREE.SphereGeometry(.11,14,14),new THREE.MeshBasicMaterial({color:0xffd98a}),0,3.28,0);fm.scale.set(.8,1.5,.8);

let lit=true,drag=false,sx=0,mv=0;
wrap.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;mv=0;wrap.setPointerCapture(e.pointerId);wrap.style.cursor='grabbing'});
wrap.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx;sx=e.clientX;mv+=Math.abs(dx);G.rotation.y+=dx*.012});
wrap.addEventListener('pointerup',()=>{drag=false;wrap.style.cursor='grab';if(mv<6){lit=!lit;
 $('#cm').textContent=lit?"the candle is back, wish again":"may every wish you made come true, Prajjuu";if(!lit)burst(140)}});
(function lp(t){
  if(!drag)G.rotation.y+=.004;G.position.y=Math.sin(t/1000)*.06;
  const s=lit?1+Math.sin(t/90)*.12:0;fm.scale.set(.8*s,1.5*s,.8*s);fl.intensity=lit?1.1+Math.sin(t/80)*.2:0;
  R.render(S,C);requestAnimationFrame(lp)})(0);
})();

// ---------- soft confetti ----------
const cv=$('#fx'),cx=cv.getContext('2d');let bits=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}addEventListener('resize',rs);rs();
const pc=['#efd2d6','#c58290','#e6dcf2','#f6e6c4','#c4a26a','#ffffff'];
function burst(n){for(let i=0;i<n;i++)bits.push({x:innerWidth/2,y:innerHeight*.65,vx:(Math.random()-.5)*14,vy:-Math.random()*15-4,s:Math.random()*6+3,c:pc[i%6],l:1})}
(function lp(){cx.clearRect(0,0,cv.width,cv.height);bits=bits.filter(b=>b.l>0);
bits.forEach(b=>{b.vy+=.22;b.vx*=.99;b.x+=b.vx;b.y+=b.vy;b.l-=.005;cx.globalAlpha=Math.max(b.l,0);cx.fillStyle=b.c;cx.beginPath();cx.arc(b.x,b.y,b.s,0,7);cx.fill()});
requestAnimationFrame(lp)})();
</script>
</body>
</html>
